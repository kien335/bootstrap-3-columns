
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid và Flexbox</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        .carousel-item img {
            height: 350px;
            object-fit: cover;
        }

        @media (max-width: 768px) {
            .carousel-item img {
                height: 200px;
            }
        }
    </style>
</head>
<body>

    <!-- Bước 1: Grid 3 cột -->
    <div class="container mt-5">
        <h2 class="text-center mb-4">
            Bố Cục 3 Cột Bootstrap
        </h2>

        <div class="row">
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3">
                <p class="mb-0">Phần 1</p>
            </div>

            <div class="col-md-4 d-flex justify-content-center align-items-center bg-secondary p-3 text-white">
                <p class="mb-0">Phần 2</p>
            </div>

            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3">
                <p class="mb-0">Phần 3</p>
            </div>
        </div>
    </div>

    <!-- Bước 2: Margin & Padding -->
    <div class="container my-5 py-3">
        <h3 class="text-center">
            Khoảng cách được điều chỉnh bằng Margin & Padding
        </h3>
    </div>

    <!-- Bước 3: Display Property -->
    <div class="d-none d-md-block bg-warning text-center p-3">
        <p class="mb-0">
            Nội dung này chỉ hiển thị trên màn hình lớn hơn hoặc bằng 768px
        </p>
    </div>

    <!-- Bước 4: Carousel -->
    <div class="container">
        <div id="myCarousel" class="carousel slide mt-5"
             data-bs-ride="carousel">

            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://picsum.photos/id/1018/1200/450"
                         class="d-block w-100"
                         alt="Hình ảnh 1">
                </div>

                <div class="carousel-item">
                    <img src="https://picsum.photos/id/1015/1200/450"
                         class="d-block w-100"
                         alt="Hình ảnh 2">
                </div>

                <div class="carousel-item">
                    <img src="https://picsum.photos/id/1016/1200/450"
                         class="d-block w-100"
                         alt="Hình ảnh 3">
                </div>
            </div>

            <button class="carousel-control-prev"
                    type="button"
                    data-bs-target="#myCarousel"
                    data-bs-slide="prev"
                    aria-label="Ảnh trước">
                <span class="carousel-control-prev-icon"
                      aria-hidden="true"></span>
            </button>

            <button class="carousel-control-next"
                    type="button"
                    data-bs-target="#myCarousel"
                    data-bs-slide="next"
                    aria-label="Ảnh tiếp theo">
                <span class="carousel-control-next-icon"
                      aria-hidden="true"></span>
            </button>
        </div>
    </div>

    <!-- Bước 5: Font Awesome -->
    <div class="container mt-5 text-center">
        <h3>
            <i class="fas fa-home"></i>
            Trang chủ
        </h3>
    </div>

    <!-- Bước 6: Form liên hệ -->
    <form class="container my-5">
        <h2 class="text-center mb-4">
            Form Liên Hệ
        </h2>

        <div class="mb-3">
            <label for="name" class="form-label">
                Họ và tên
            </label>
            <input type="text"
                   class="form-control"
                   id="name"
                   placeholder="Nhập họ và tên"
                   required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">
                Email
            </label>
            <input type="email"
                   class="form-control"
                   id="email"
                   placeholder="Nhập email"
                   required>
        </div>

        <div class="mb-3">
            <label for="message" class="form-label">
                Nội dung
            </label>
            <textarea class="form-control"
                      id="message"
                      rows="4"
                      placeholder="Nhập nội dung"
                      required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="fas fa-paper-plane"></i>
            Gửi
        </button>
    </form>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
